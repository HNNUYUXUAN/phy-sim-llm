<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#333"/></marker></defs><rect width="1200" height="760" fill="white"/><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#202020;font-size:22px} .title{font-size:30px;font-weight:600} .note{font-size:18px;fill:#555} .box{fill:#fafafa;stroke:#444;stroke-width:2} .line{fill:none;stroke:#444;stroke-width:2;marker-end:url(#arrow)}</style><text x="55" y="65" class="title">图 1  双缝干涉与单缝衍射原理</text><rect class="box" x="55" y="260" width="170" height="90" rx="8"/><text x="140" y="295" text-anchor="middle">单色平面波</text><text class="note" x="140" y="327" text-anchor="middle">波长 λ</text><path class="line" d="M225 305L360 305"/><path d="M385 135V255M385 285V345M385 375V560" stroke="#333" stroke-width="8"/><text x="350" y="605">双缝板</text><text x="410" y="280">S₁</text><text x="410" y="373">S₂</text><path d="M385 270L1000 180M385 360L1000 180" fill="none" stroke="#555" stroke-width="2"/><path d="M1000 130V560M385 315H1000" stroke="#333" stroke-width="2"/><circle cx="1000" cy="180" r="5" fill="#333"/><text x="1020" y="187">P</text><text x="1020" y="322">O</text><text x="1040" y="255">x</text><text x="960" y="605">观察屏</text><path d="M465 270V360M452 270H478M452 360H478M385 510H1000M385 495V525M1000 495V525" stroke="#555"/><text x="483" y="323">d</text><text x="670" y="498">物理距离 D</text><text x="55" y="665">Iₙ(η) = sinc²(πaη/λ) · cos²(πdη/λ)，η ≈ x/D</text><text class="note" x="55" y="705">显示映射 η=(u−u₀)/(4Dsim Z)；Dsim、Z 不等于物理距离 D。新绘示意，非按比例。</text><path d="M340 255V285M330 255H350M330 285H350" stroke="#555"/><text x="310" y="277">a</text><path d="M1070 180V315M1058 180H1082M1058 315H1082" stroke="#555"/></svg>